[project]
name = "an-clicker"
version = "1.0.0b1"
description = "Cross-platform visual automation workspace for Windows, macOS, and Linux"
requires-python = ">=3.10"
dependencies = [
    "PyQt5==5.15.10",
    "PyQt5-Qt5==5.15.2",
    "QtPy==2.4.3",
    "pyttsx4",
    "pymsgbox",
    "pyautogui",
    "PyWinCtl>=0.4.1",
    "mouse; sys_platform != 'darwin'",
    "keyboard; sys_platform != 'darwin'",
    "pynput; sys_platform == 'darwin'",
    "pandas",
    "pillow",
    "openpyxl",
    "requests",
    "system_hotkey; sys_platform != 'darwin'",
    "pygments",
    "opencv-python",
    "baidu-aip",
    "chardet",
    "pyinstaller",
    "python-dateutil",
    "psutil",
]

[project]
name = "an-clicker"
dynamic = ["version"]
description = "Cross-platform visual automation workspace for Windows, macOS, and Linux"
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "pyttsx4",
    "pymsgbox",
    "pyautogui",
    "PyWinCtl>=0.4.1",
    "mouse; sys_platform != 'darwin'",
    "keyboard; sys_platform != 'darwin'",
    "pynput==1.7.7",
    "pandas",
    "pillow",
    "openpyxl",
    "requests",
    "system_hotkey; sys_platform != 'darwin'",
    "pygments",
    "opencv-python",
    "baidu-aip",
    "chardet",
    "pyinstaller",
    "python-dateutil",
    "psutil",
    "velopack==1.2.0; sys_platform == 'win32'",
]

[dependency-groups]
release = ["pytest"]
[tool.uv]
package = false

[tool.setuptools]
py-modules = ["info"]

[tool.setuptools.dynamic]
version = {attr = "info.CURRENT_VERSION"}

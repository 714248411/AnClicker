[project]
name = "an-clicker"
version = "1.3.3"
description = "Cross-platform visual automation workspace for Windows, macOS, and Linux"
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "pyttsx4",
    "pymsgbox",
    "pyautogui",
    "PyWinCtl>=0.4.1",
    "mouse; sys_platform != 'darwin'",
    "keyboard; sys_platform != 'darwin'",
    "pynput; sys_platform == 'darwin'",
    "pandas",
    "pillow",
    "openpyxl",
    "requests",
    "system_hotkey; sys_platform != 'darwin'",
    "pygments",
    "opencv-python",
    "baidu-aip",
    "chardet",
    "pyinstaller",
    "python-dateutil",
    "psutil",
    "rapidocr-onnxruntime==1.4.4",
    "onnxruntime==1.20.1",
]

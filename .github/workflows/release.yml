name: Build PyQt5 legacy Windows release

on:
  push:
    tags:
      - "v*-legacy*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_API: pyqt5
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -v
      - name: Build application
        run: python -m PyInstaller --clean -y packaging/main.spec
      - name: Verify packaged startup, editors and migration
        run: python packaging/smoke_release.py
      - name: Package legacy edition and matching source
        run: python packaging/build_legacy_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: pyqt5-legacy-windows-x64
          path: release/*
          if-no-files-found: error
      - name: Publish separate compatibility preview
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/*.zip release/SHA256SUMS.txt --repo "${{ github.repository }}" --title "An Clicker v1.2.6 旧系统版（win101607兼容未经测试）" --prerelease --latest=false --notes-file LEGACY_WINDOWS.md

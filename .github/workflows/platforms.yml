name: Upload verified native release assets
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: 714248411/AnClicker
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: final-platform-packages
          path: delivery
          run-id: 38334398952
          github-token: ${{ github.token }}
      - name: Require all native tests to pass
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          def api(path):
              req=urllib.request.Request('https://api.github.com/repos/714248411/AnClicker'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          for i in range(40):
              r=api('/actions/runs/38334398952')
              if r['status']=='completed':
                  assert r['conclusion']=='success',r['conclusion']
                  break
              time.sleep(20)
          else:raise RuntimeError('Native verification still pending')
          r=api('/releases/tags/v1.5.4')
          assert r['draft'],'Release must still be a draft'
          PY
      - name: Validate and upload native archives
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,json,zipfile,subprocess,os,urllib.request
          folder=pathlib.Path('delivery')
          expected=json.loads((folder/'SHA256.json').read_text())
          result=[]
          for platform in ['linux','mac']:
              p=folder/('AnClicker-v1.5.4-'+platform+'.zip')
              with zipfile.ZipFile(p) as z:assert z.testzip() is None
              sha=hashlib.sha256(p.read_bytes()).hexdigest()
              assert sha==expected[p.name]
              subprocess.run(['gh','release','upload','v1.5.4',str(p)],check=True)
              result.append({'name':p.name,'size':p.stat().st_size,'sha256':sha})
          req=urllib.request.Request('https://api.github.com/repos/714248411/AnClicker/releases/tags/v1.5.4',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req) as r:release=json.load(r)
          for record in result:
              a=next(a for a in release['assets'] if a['name']==record['name'])
              assert a['size']==record['size'] and a['digest']=='sha256:'+record['sha256']
          pathlib.Path('native-upload.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-upload-verification
          path: native-upload.json
